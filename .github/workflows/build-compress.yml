name: build-compress
on:
  push:
    branches: [main]
    paths: ["compress/**", ".github/workflows/build-compress.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./compress
          push: true
          tags: ghcr.io/${{ github.repository }}:compress
          cache-from: type=gha
          cache-to: type=gha,mode=max
