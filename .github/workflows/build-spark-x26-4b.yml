name: build-spark-x26-4b
on:
  push:
    branches: [main]
    paths: ["spark-x26-4b/**", ".github/workflows/build-spark-x26-4b.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./spark-x26-4b
          push: true
          tags: ghcr.io/${{ github.repository }}:spark-x26-4b
          cache-from: type=gha
          cache-to: type=gha,mode=max
